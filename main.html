<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Travel Tour - ONTRIGO</title>
  <link rel="stylesheet" href="main.css">
  <script src="js/auth.js"></script>
  <!-- <button><a href="html/booking.html" target="_blank">Book now</a></button> -->
</head>
<body>
  <header>
    <div class="container">
      <h1><span>ONTRIGO</span></h1>
      <nav>
        <ul>
          <li><a href="html/about.html">About</a></li>
          <li><a href="html/contact.html">Contact</a></li>
          <!-- <li><a href="html/booking.html">Bookings</a></li> -->
          <li><a href="html/activities.html">Activities</a></li>
          <li><a href="html/hotel.html">Hotel</a></li>
          <li><a id="logoutBtn" style="background:none; color:#fff; font-weight:600; font-size:16px; border:none; cursor:pointer; padding:0 10px;">Logout</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <h1>Welcome to ONTRIGO</h1>
    <p>Your journey begins here. Explore the best destinations and travel packages.</p>
    <button class="explore-btn" onclick="explorePackages()">Explore Packages</button>
  </section>

  <!-- Tours Section -->
  <section id="tours">
    <h2>Our Top Packages</h2>
    <div class="tour-grid" id="tourGrid">
      <!-- Packages will be inserted here by JavaScript -->
    </div>
  </section>

  <footer>
    <p>&copy; 2024 ONTRIGO Travel Tours. All rights reserved.</p>
  </footer>

  <script>
    // Logout button functionality
    document.addEventListener('DOMContentLoaded', function() {
      const logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', function(e) {
          e.preventDefault();
          localStorage.removeItem('isLoggedIn');
          window.location.href = '/html/login.html';
        });
      }
    });

    // Package Data
    const packages = [
      {
        name: "New York City",
        img: "photos/newyork.jpg",
        desc: "Explore the bustling streets and iconic landmarks of New York City.",
        duration: "3 Days",
        price: "$599",
        highlights: "Statue of Liberty, Central Park, Times Square"
      },
      {
        name: "Paris",
        img: "photos/paris.jpg",
        desc: "Discover the romance and charm of Paris, the city of lights.",
        duration: "5 Days",
        price: "$999",
        highlights: "Eiffel Tower, Louvre Museum, Notre-Dame Cathedral"
      },
      {
        name: "Tokyo",
        img: "photos/tokyo.jpg",
        desc: "Experience the vibrant culture and futuristic technology of Tokyo.",
        duration: "7 Days",
        price: "$1299",
        highlights: "Shibuya Crossing, Tokyo Tower, Akihabara"
      },
      {
        name: "Rome",
        img: "photos/rome.jpg",
        desc: "Step back in time and explore the ancient history of Rome.",
        duration: "4 Days",
        price: "$799",
        highlights: "Colosseum, Vatican City, Pantheon"
      },
      {
        name: "Sydney",
        img: "photos/sydney.jpg",
        desc: "Enjoy the stunning harbors, beaches, and landmarks of Sydney.",
        duration: "6 Days",
        price: "$1099",
        highlights: "Sydney Opera House, Bondi Beach, Harbour Bridge"
      },
      {
        name: "Cape Town",
        img: "photos/capetown.jpg",
        desc: "Discover the natural beauty and vibrant culture of Cape Town.",
        duration: "5 Days",
        price: "$849",
        highlights: "Table Mountain, V&A Waterfront, Robben Island"
      },
      {
        name: "Rio de Janeiro",
        img: "photos/rio.jpg",
        desc: "Experience the lively culture and stunning landscapes of Rio de Janeiro.",
        duration: "5 Days",
        price: "$899",
        highlights: "Christ the Redeemer, Copacabana Beach, Sugarloaf Mountain"
      },
      {
        name: "Dubai",
        img: "photos/dubai.jpg",
        desc: "Immerse yourself in the luxury and innovation of Dubai.",
        duration: "4 Days",
        price: "$999",
        highlights: "Burj Khalifa, Dubai Mall, Desert Safari"
      },
      {
        name: "Istanbul",
        img: "photos/istanbul.jpg",
        desc: "Experience the rich history and diverse culture of Istanbul.",
        duration: "5 Days",
        price: "$799",
        highlights: "Hagia Sophia, Blue Mosque, Grand Bazaar"
      }
    ];

    // Generate Packages
    const tourGrid = document.getElementById("tourGrid");
    packages.forEach(pkg => {
      const div = document.createElement("div");
      div.classList.add("tour");
      div.innerHTML = `
        <img src="${pkg.img}" alt="${pkg.name}">
        <h3>${pkg.name}</h3>
        <p>${pkg.desc}</p>
        <ul>
          <li>Duration: ${pkg.duration}</li>
          <li>Price: ${pkg.price}</li>
          <li>Highlights: ${pkg.highlights}</li>
        </ul>
        <button><a href="html/booking.html" target="_blank">Book now</a></button>
      `;
      tourGrid.appendChild(div);
    });

    // Smooth scroll function
    function explorePackages() {
      document.getElementById("tours").scrollIntoView({ behavior: 'smooth' });
    }
  </script>


</body>
</html>
